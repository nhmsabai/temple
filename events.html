<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events — Shiva Temple Oslo</title>
    <link rel="stylesheet" href="css/site.css" />
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <div class="logo-mark">ॐ</div>
                <div class="logo-text">
                    <strong>Shiva Temple Oslo</strong>
                    <span>NhmSabai · Norway</span>
                </div>
            </a>

            <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="events.html" class="active">Events</a>
    <a href="info.html">About</a>
    <a href="contact.html">Contact</a>
</nav>
        </div>
    </header>

    <main class="page-main">
        <section class="page-header">
            <div class="container">
                <h1>Events</h1>
                <p>Upcoming and recurring events at Shiva Temple Oslo</p>
            </div>
        </section>

        <section class="container events-container">

            <!-- Filter bar -->
            <div class="events-filter">
                <div class="filter-group">
                    <label for="dateFilter">Pick a date</label>
                    <input type="date" id="dateFilter" />
                </div>

                <div class="filter-actions">
                    <button type="button" class="btn-filter" id="btnToday">Today</button>
                    <button type="button" class="btn-filter" id="btnUpcoming">Upcoming</button>
                    <button type="button" class="btn-filter" id="btnAll">All</button>
                </div>

                <div class="filter-status" id="filterStatus">
                    Showing: <strong>All events</strong>
                </div>
            </div>

            <!-- Event list -->
            <div id="eventsList" class="events-list">
                <p class="events-loading">Loading events…</p>
            </div>

        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>© <span id="year"></span> NhmSabai · Shiva Temple Oslo</p>

            <nav class="footer-links">
                <a href="index.html">Home</a>
                <a href="events.html">Events</a>
                <a href="info.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>

            <p class="footer-contact">
                📍 Industriveien 1, 2020 Skedsmokorset ·
                📞 41 28 96 40 ·
                ✉️ nhmsabai@gmail.com
            </p>
        </div>
    </footer>

    <script src="js/site.js"></script>
    <script src="js/events.js"></script>
</body>
</html>
